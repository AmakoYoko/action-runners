name: vm
run-name: vm ${{ inputs.vm_id }}
on:
  workflow_dispatch:
    inputs:
      vm_id: { description: "Identifiant VM", required: true }
      ticket: { description: "Ticket à usage unique", required: true }
      profile: { description: "Profil", required: true }
      image: { description: "Image conteneur (optionnel)", required: false, default: "" }
      minutes: { description: "Durée (min, max 300)", required: true, default: "60" }
      ssh_key: { description: "Clé SSH publique", required: true }
      hostname: { description: "Nom d'hôte", required: true }
      app: { description: "owner/repo[@ref] à déployer (optionnel)", required: false, default: "" }
      os: { description: "linux, linux-arm, windows ou macos", required: false, default: "linux" }
permissions:
  packages: read
concurrency:
  group: vm-${{ inputs.vm_id }}
jobs:
  vm:
    if: ${{ inputs.os == 'linux' || inputs.os == 'linux-arm' }}
    runs-on: ${{ inputs.os == 'linux-arm' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      API: https://action.lamas.one
      VM_ID: ${{ inputs.vm_id }}
      TICKET: ${{ inputs.ticket }}
      IMAGE: ${{ inputs.image }}
      SSH_KEY: ${{ inputs.ssh_key }}
      VM_HOST: ${{ inputs.hostname }}
      APP: ${{ inputs.app }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Rejoindre le réseau Lamas
        run: |
          set -euo pipefail
          echo "::add-mask::$TICKET"
          J=$(curl -fsS -m 30 -X POST "$API/api/runner/join" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "$TICKET" --argjson r "$RUN_ID" '{vm_id:$v,ticket:$t,run_id:$r}')")
          AUTHKEY=$(jq -r .authkey <<<"$J"); TOKEN=$(jq -r .token <<<"$J")
          echo "::add-mask::$AUTHKEY"; echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(jq -r .expiresAt <<<"$J")" >> "$GITHUB_ENV"
          [ "$(jq -r .successor <<<"$J")" = "true" ] && echo "SUCC=1" >> "$GITHUB_ENV" || true
          jq -c '{env:(.env//{}),setup:(.setup//"")}' <<<"$J" > "$RUNNER_TEMP/profile.json"
          curl -fsSL https://tailscale.com/install.sh -o /tmp/ts.sh && sudo sh /tmp/ts.sh >/dev/null
          sudo tailscale up --login-server "$(jq -r .server <<<"$J")" --authkey "$AUTHKEY" \
            --hostname "$VM_HOST" --accept-routes --accept-dns=false
          tailscale ip -4
      - name: SSH
        run: |
          set -euo pipefail
          sudo hostnamectl set-hostname "$VM_HOST" 2>/dev/null || sudo hostname "$VM_HOST" || true
          grep -q "$VM_HOST" /etc/hosts || echo "127.0.0.1 $VM_HOST" | sudo tee -a /etc/hosts >/dev/null
          mkdir -p ~/.ssh ~/work && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          # session durable : reconnexion = même session tmux (interactif uniquement)
          (sudo apt-get install -y -qq tmux >/dev/null 2>&1 || true)
          grep -q 'tmux new-session' ~/.bashrc || printf '%s\n' 'if [ -n "$SSH_CONNECTION" ] && [ -z "$TMUX" ] && command -v tmux >/dev/null; then exec tmux new-session -A -s main; fi' >> ~/.bashrc
      - name: Image du profil
        if: ${{ inputs.image != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || true
          if docker pull "$IMAGE"; then
            docker run -d --name work --network host --restart no -v "$HOME/work:/work" -w /work "$IMAGE" sleep infinity
          else
            echo "::warning::image $IMAGE indisponible, repli sur le runner nu"
          fi
      - name: Configuration du profil
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/profile.json"
          jq -r '.env|to_entries[]|.value' "$P" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done || true
          jq -r '.env|to_entries[]|"export \(.key)=\(.value|@sh)"' "$P" > "$HOME/.action-env"; chmod 600 "$HOME/.action-env"
          grep -q action-env ~/.bashrc || echo '[ -f ~/.action-env ] && . ~/.action-env' >> ~/.bashrc
          . "$HOME/.action-env"
          S=$(jq -r .setup "$P"); [ -n "$S" ] && bash -c "$S" || true
      - name: Application
        if: ${{ inputs.app != '' && env.SUCC != '1' }}
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(@[A-Za-z0-9._/-]+)?$ ]] || { echo "app invalide"; exit 1; }
          REPO=${APP%%@*}; REF=${APP#*@}; [ "$REF" = "$APP" ] && REF=""
          git clone --depth 1 ${REF:+-b "$REF"} "https://github.com/$REPO" "$HOME/work/app"
          cd "$HOME/work/app"
          if [ -f compose.yaml ] || [ -f docker-compose.yml ]; then docker compose up -d --build; elif [ -x deploy.sh ]; then ./deploy.sh; fi
      - name: Reprise depuis la VM précédente
        if: env.SUCC == '1'
        run: |
          set -euo pipefail
          call() { curl -fsS -m 20 -X POST "$API/api/runner/$1" -H 'content-type: application/json' -d "$2"; }
          body() { jq -nc --arg v "$VM_ID" --arg t "$TOKEN" "$@"; }
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/handoff
          call ready "$(body --arg ip "$(tailscale ip -4)" --arg pk "$(cut -d' ' -f1,2 ~/.ssh/handoff.pub)" '{vm_id:$v,token:$t,ip:$ip,pubkey:$pk}')" >/dev/null
          wait_hand() { for _ in $(seq 1 90); do R=$(call poll "$(body '{vm_id:$v,token:$t}')"); [ "$(jq -r .hand <<<"$R")" = "$1" ] && { PEER=$(jq -r .peerIp <<<"$R"); return 0; }; sleep 4; done; echo "délai dépassé ($1)"; return 1; }
          wait_hand authorized
          RS="rsync -a --delete -e 'ssh -i $HOME/.ssh/handoff -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15'"
          eval $RS "runner@$PEER:work/" "$HOME/work/"
          eval $RS "runner@$PEER:work/" "$HOME/work/"   # 2e passe à chaud : le gel final ne copie plus que le delta
          if [ -d "$HOME/work/app" ]; then (cd "$HOME/work/app" && { docker compose pull -q --ignore-pull-failures; docker compose build -q; }) 2>/dev/null || true; fi
          call handoff "$(body '{vm_id:$v,token:$t,stage:"pass1"}')" >/dev/null
          wait_hand frozen
          eval $RS "runner@$PEER:work/" "$HOME/work/"
          # identité SSH de la VM précédente (pas d'alerte de clé) et volumes Docker nommés
          if ls "$HOME"/work/.handoff/ssh/ssh_host_* >/dev/null 2>&1; then sudo cp "$HOME"/work/.handoff/ssh/ssh_host_* /etc/ssh/ && sudo chmod 600 /etc/ssh/ssh_host_*_key && sudo systemctl restart ssh || true; fi
          for f in "$HOME"/work/.handoff/vol/*.tgz; do [ -f "$f" ] || continue; n=$(basename "$f" .tgz); docker volume create "$n" >/dev/null; sudo tar xzf "$f" -C "/var/lib/docker/volumes/$n/_data"; done
          for f in "$HOME/work/app/compose.yaml" "$HOME/work/app/docker-compose.yml"; do [ -f "$f" ] && (cd "$HOME/work/app" && docker compose up -d) && break; done || true
          call handoff "$(body '{vm_id:$v,token:$t,stage:"synced"}')" >/dev/null
      - name: Prête
        if: env.SUCC != '1'
        run: |
          IP=$(tailscale ip -4)
          curl -fsS -m 30 -X POST "$API/api/runner/ready" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" --arg ip "$IP" '{vm_id:$v,token:$t,ip:$ip}')"
      - name: Attendre l'échéance
        run: |
          while true; do
            R=$(curl -fsS -m 20 -X POST "$API/api/runner/poll" -H 'content-type: application/json' \
              -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" '{vm_id:$v,token:$t}')" || echo '{}')
            [ "$(jq -r '.stop // false' <<<"$R")" = "true" ] && break
            A=$(jq -r '.authorize // empty' <<<"$R")
            if [ -n "$A" ] && [ ! -f /tmp/h_auth ]; then
              echo "from=\"100.64.0.0/10\" $A" >> ~/.ssh/authorized_keys; touch /tmp/h_auth
              curl -fsS -m 20 -X POST "$API/api/runner/handoff" -H 'content-type: application/json' -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" '{vm_id:$v,token:$t,stage:"authorized"}')" >/dev/null
            fi
            if [ "$(jq -r '.freeze // false' <<<"$R")" = "true" ] && [ ! -f /tmp/h_frozen ]; then
              (cd ~/work/app 2>/dev/null && docker compose stop -t 10) || true
              docker ps -q | xargs -r docker stop -t 10 >/dev/null || true
              H=~/work/.handoff; rm -rf "$H"; mkdir -p "$H/ssh" "$H/vol"
              sudo cp /etc/ssh/ssh_host_* "$H/ssh/" && sudo chown -R "$USER" "$H/ssh"
              for v in $(docker volume ls -q); do sudo tar czf "$H/vol/$v.tgz" -C "/var/lib/docker/volumes/$v/_data" . 2>/dev/null || true; done
              sudo chown -R "$USER" "$H"; touch /tmp/h_frozen
              curl -fsS -m 20 -X POST "$API/api/runner/handoff" -H 'content-type: application/json' -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" '{vm_id:$v,token:$t,stage:"frozen"}')" >/dev/null
            fi
            sleep 8
          done
      - name: Nettoyage
        if: always()
        run: |
          curl -fsS -m 20 -X POST "$API/api/runner/done" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "${TOKEN:-}" '{vm_id:$v,token:$t}')" || true
          sudo tailscale logout || true

  windows:
    if: ${{ inputs.os == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    env:
      API: https://action.lamas.one
      VM_ID: ${{ inputs.vm_id }}
      TICKET: ${{ inputs.ticket }}
      VM_HOST: ${{ inputs.hostname }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Rejoindre le réseau Lamas
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "::add-mask::$env:TICKET"
          $body = @{ vm_id = $env:VM_ID; ticket = $env:TICKET; run_id = [int64]$env:RUN_ID } | ConvertTo-Json
          $j = Invoke-RestMethod -Method Post -Uri "$env:API/api/runner/join" -ContentType 'application/json' -Body $body -TimeoutSec 30
          Write-Output "::add-mask::$($j.authkey)"; Write-Output "::add-mask::$($j.token)"
          "TOKEN=$($j.token)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $m = Invoke-RestMethod 'https://pkgs.tailscale.com/stable/?mode=json'
          $msi = Join-Path $env:RUNNER_TEMP 'ts.msi'
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/$($m.MSIs.amd64)" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart TS_NOLAUNCH=1" -Wait
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          for ($i = 0; $i -lt 30 -and -not (Get-Service Tailscale -ErrorAction SilentlyContinue | Where-Object Status -eq 'Running'); $i++) { Start-Sleep 2 }
          & $ts up --login-server $j.server --authkey $j.authkey --hostname $env:VM_HOST --unattended --accept-dns=false --accept-routes
          & $ts ip -4
      - name: Bureau à distance (RDP)
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP tailnet' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow | Out-Null
          Set-Service TermService -StartupType Automatic; Start-Service TermService
          $pw = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 20 | ForEach-Object { [char]$_ })
          Write-Output "::add-mask::$pw"
          net user runneradmin $pw | Out-Null
          "RDP_PW=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Prête
        run: |
          $ip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4).Trim()
          $body = @{ vm_id = $env:VM_ID; token = $env:TOKEN; ip = $ip; rdpUser = 'runneradmin'; rdpPass = $env:RDP_PW } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:API/api/runner/ready" -ContentType 'application/json' -Body $body -TimeoutSec 30 | Out-Null
      - name: Attendre l'échéance
        run: |
          while ($true) {
            try {
              $body = @{ vm_id = $env:VM_ID; token = $env:TOKEN } | ConvertTo-Json
              $r = Invoke-RestMethod -Method Post -Uri "$env:API/api/runner/poll" -ContentType 'application/json' -Body $body -TimeoutSec 20
              if ($r.stop) { break }
            } catch { }
            Start-Sleep 10
          }
      - name: Nettoyage
        if: always()
        run: |
          try {
            $body = @{ vm_id = $env:VM_ID; token = "$env:TOKEN" } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$env:API/api/runner/done" -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
          } catch { }
          & 'C:\Program Files\Tailscale\tailscale.exe' logout 2>$null

  macos:
    if: ${{ inputs.os == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 330
    env:
      API: https://action.lamas.one
      VM_ID: ${{ inputs.vm_id }}
      TICKET: ${{ inputs.ticket }}
      SSH_KEY: ${{ inputs.ssh_key }}
      VM_HOST: ${{ inputs.hostname }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Rejoindre le réseau Lamas
        run: |
          set -eo pipefail
          echo "::add-mask::$TICKET"
          J=$(curl -fsS -m 30 -X POST "$API/api/runner/join" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "$TICKET" --argjson r "$RUN_ID" '{vm_id:$v,ticket:$t,run_id:$r}')")
          AUTHKEY=$(jq -r .authkey <<<"$J"); TOKEN=$(jq -r .token <<<"$J")
          echo "::add-mask::$AUTHKEY"; echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          brew install tailscale >/dev/null 2>&1
          sudo mkdir -p /var/lib/tailscale /var/run
          sudo nohup "$(brew --prefix)/bin/tailscaled" --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscaled.socket >/tmp/tailscaled.log 2>&1 &
          sleep 6
          sudo "$(brew --prefix)/bin/tailscale" up --login-server "$(jq -r .server <<<"$J")" --authkey "$AUTHKEY" \
            --hostname "$VM_HOST" --accept-routes --accept-dns=false
          "$(brew --prefix)/bin/tailscale" ip -4
      - name: Bureau à distance (VNC) et SSH
        run: |
          set -o pipefail
          lg() { curl -fsS -m 10 -X POST "$API/api/runner/log" -H 'content-type: application/json' -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" --arg l "$1" '{vm_id:$v,token:$t,line:$l}')" >/dev/null 2>&1 || true; }
          # macOS n'a pas `timeout` : chaque commande système est bornée à 40 s (elles peuvent attendre une autorisation)
          bounded() { perl -e 'alarm shift; exec @ARGV' 40 "$@" >/tmp/bounded.log 2>&1; local rc=$?; lg "rc=$rc $(tr '\n' ' ' </tmp/bounded.log | tail -c 200)"; return $rc; }
          lg "début étape VNC ($(sw_vers -productVersion), $(uname -m))"
          PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-8)
          echo "::add-mask::$PW"; echo "VNC_PW=$PW" >> "$GITHUB_ENV"; lg "mot de passe généré (${#PW} car.)"
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          lg "kickstart"; bounded sudo "$K" -activate -configure -access -on -restart -agent -privs -all -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PW" || true
          bounded sudo "$K" -configure -allowAccessFor -allUsers -privs -all || true
          # le serveur propose d'abord l'authentification Apple (compte local + mot de passe) : on crée un compte dédié
          lg "compte lamas"; bounded sudo sysadminctl -addUser lamas -fullName Lamas -password "$PW" -admin || true
          # sans autorisation « Enregistrement de l'écran », le serveur de partage d'écran envoie une image noire (SIP est désactivé sur le runner)
          TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          for C in com.apple.screensharing.agent com.apple.screensharing.MessagesAgent com.apple.RemoteDesktop.agent com.apple.screensharing.server /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent /System/Library/CoreServices/RemoteManagement/ARDAgent.app; do
            T=0; case "$C" in /*) T=1;; esac
            bounded sudo sqlite3 "$TCC" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified) VALUES ('kTCCServiceScreenCapture','$C',$T,2,4,1,NULL,NULL,0,'UNUSED',0,CAST(strftime('%s','now') AS INTEGER))" || true
          done
          sudo killall tccd 2>/dev/null || true
          lg "launchctl"; bounded sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          if [ -n "$SSH_KEY" ] && [ "$SSH_KEY" != "-" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            lg "ssh"; bounded sudo systemsetup -setremotelogin on || true
          fi
          for i in $(seq 1 20); do nc -z 127.0.0.1 5900 && break; sleep 2; done
          if nc -z 127.0.0.1 5900; then lg "VNC en écoute"; else lg "VNC NON joignable"; lg "$(sudo lsof -iTCP -sTCP:LISTEN -P 2>/dev/null | awk '{print $1":"$9}' | tr '\n' ' ' | tail -c 250)"; fi
      - name: Prête
        run: |
          IP=$("$(brew --prefix)/bin/tailscale" ip -4)
          curl -fsS -m 30 -X POST "$API/api/runner/ready" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" --arg ip "$IP" --arg pw "$VNC_PW" '{vm_id:$v,token:$t,ip:$ip,rdpUser:"lamas",rdpPass:$pw}')"
      - name: Attendre l'échéance
        run: |
          while true; do
            R=$(curl -fsS -m 20 -X POST "$API/api/runner/poll" -H 'content-type: application/json' \
              -d "$(jq -nc --arg v "$VM_ID" --arg t "$TOKEN" '{vm_id:$v,token:$t}')" || echo '{}')
            [ "$(jq -r '.stop // false' <<<"$R")" = "true" ] && break
            sleep 10
          done
      - name: Nettoyage
        if: always()
        run: |
          curl -fsS -m 20 -X POST "$API/api/runner/done" -H 'content-type: application/json' \
            -d "$(jq -nc --arg v "$VM_ID" --arg t "${TOKEN:-}" '{vm_id:$v,token:$t}')" || true
          sudo "$(brew --prefix)/bin/tailscale" logout || true

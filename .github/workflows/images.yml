name: images
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.l.outputs.names }}
    steps:
      - id: l
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}" src
          echo "names=$(ls -d src/images/*/ 2>/dev/null | xargs -rn1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  build:
    needs: list
    if: ${{ needs.list.outputs.names != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    steps:
      - run: git clone --depth 1 "https://github.com/${{ github.repository }}" src
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "ghcr.io/$OWNER/action-$NAME:latest" "src/images/$NAME"
          docker push "ghcr.io/$OWNER/action-$NAME:latest"
